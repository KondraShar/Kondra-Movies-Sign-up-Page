<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Kondra Movies</title>
</head>
<body>

    <div class="page">
        <img width="400px" src="spilled-popcorn-bucket-by-andrew-solok.jpg" alt="spilled pop corn bucket on a cinema floor">
        
        <div class="container">
            <div class="service-info">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
                <p>You know you want to.</p>
            </div>

            <form class="contact-container">
                <div class="contact-ticket">
                    <fieldset class="user-name">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name">

                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name">
                    </fieldset>

                    <fieldset class="user-details">
                        <label for="email">E-MAIL</label>
                        <input type="email" id="email" name="e_mail">

                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="text" id="phone-number" name="phone_number">
                    </fieldset>

                    <fieldset class="user-password">
                        <label for="first-password">PASSWORD</label>
                        <input type="password" id="first-password" name="first_password">

                        <label for="second-password">CONFIRM PASSWORD</label>
                        <input type="password" id="second-password" name="last_password">
                    </fieldset>
                </div>

                <div class="submit-area">
                    <button type="submit">Create Account</button>
                    <p id="login">Already have an account? <a href="./login.html">Log in</a></p>
                </div>
            </form>
        </div>
    </div>

    
</body>
</html>
